name = "hex-lll-theory"
defaultTargets = ["HexLLLTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRowReduceTheory"
git = "https://github.com/leanprover/hex-row-reduce-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexGramSchmidtTheory"
git = "https://github.com/leanprover/hex-gram-schmidt-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexLLL"
git = "https://github.com/leanprover/hex-lll.git"
rev = "v0.10.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexLLLTheory"
